server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;

        # Resolve the app container at request time so Nginx survives FPM restarts.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $php_upstream app;

        include fastcgi_params;
        fastcgi_pass $php_upstream:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Required by the JWT-protected API.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
