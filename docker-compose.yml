services:
  db:
    container_name: vms-db
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-vms}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vms

  app:
    container_name: vms-app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_DSN: mysql:host=db;dbname=${DB_NAME:-vms};charset=utf8mb4
      DB_NAME: ${DB_NAME:-vms}
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpass}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      APP_URL: ${APP_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vms

  web:
    container_name: vms-web
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - app
    networks:
      - vms

volumes:
  db_data:

networks:
  vms:
